<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Switchboard — Chat Widget</title>
<style>
  :root {
    --ink: #1c2a2e;
    --paper: #eef2ef;
    --panel: #ffffff;
    --line: #cdd8d3;
    --brass: #8a6d3b;
    --signal: #2f6f5e;
    --signal-dim: #d9e6e1;
    --danger: #a1473b;
    --mono: 'Courier New', Courier, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    font-family: var(--sans);
    color: var(--ink);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .switchboard {
    width: 100%;
    max-width: 420px;
    height: 640px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 40px -20px rgba(28, 42, 46, 0.35);
  }

  .switchboard__header {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .switchboard__title {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .switchboard__status {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--signal);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .switchboard__status::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--signal);
    box-shadow: 0 0 0 3px var(--signal-dim);
  }

  .switchboard__log {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .switchboard__log::-webkit-scrollbar { width: 6px; }
  .switchboard__log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

  .line {
    max-width: 82%;
    font-size: 14.5px;
    line-height: 1.5;
  }

  .line--bot {
    align-self: flex-start;
  }

  .line--user {
    align-self: flex-end;
    text-align: right;
  }

  .line__tag {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 4px;
  }

  .line--user .line__tag { color: var(--signal); }

  .line__bubble {
    padding: 9px 13px;
    border-radius: 2px;
    display: inline-block;
    text-align: left;
  }

  .line--bot .line__bubble {
    background: var(--paper);
    border: 1px solid var(--line);
  }

  .line--user .line__bubble {
    background: var(--ink);
    color: var(--paper);
  }

  .typing {
    align-self: flex-start;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--brass);
    padding-left: 2px;
  }

  .typing__dots span {
    display: inline-block;
    animation: blink 1.2s infinite;
  }
  .typing__dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing__dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 60%, 100% { opacity: 0.2; }
    30% { opacity: 1; }
  }

  .switchboard__intake {
    border-top: 1px solid var(--line);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .switchboard__input {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 10px 12px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    max-height: 90px;
    line-height: 1.4;
  }

  .switchboard__input:focus {
    outline: none;
    border-color: var(--signal);
  }

  .switchboard__send {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 2px;
    padding: 11px 16px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .switchboard__send:hover { background: var(--signal); }
  .switchboard__send:disabled { background: var(--line); cursor: default; }

  .switchboard__hint {
    font-family: var(--mono);
    font-size: 9.5px;
    color: #8fa39c;
    padding: 0 20px 12px;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce) {
    .typing__dots span { animation: none; }
  }
</style>
</head>
<body>

<div class="switchboard">
  <div class="switchboard__header">
    <div class="switchboard__title">Switchboard</div>
    <div class="switchboard__status">line open</div>
  </div>

  <div class="switchboard__log" id="log"></div>

  <div class="switchboard__hint">Try: hours · pricing · help · joke · bye</div>

  <div class="switchboard__intake">
    <textarea id="input" class="switchboard__input" rows="1" placeholder="Type a message…"></textarea>
    <button id="send" class="switchboard__send">Send</button>
  </div>
</div>

<script>
(function () {
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');

  // ---- Rule-based response engine -------------------------------------
  // Each rule: { test: (msg) => bool, reply: () => string | array of strings }
  const rules = [
    {
      test: m => /\b(hi|hello|hey|howdy|yo)\b/.test(m),
      reply: () => pick(["Hey there. What can I help with?", "Hello! Go ahead, I'm listening.", "Hi — how can I help today?"])
    },
    {
      test: m => /\b(hours|open|closing|close)\b/.test(m),
      reply: () => "We're open Monday–Friday, 9am–6pm. Closed weekends and public holidays."
    },
    {
      test: m => /\b(price|pricing|cost|how much)\b/.test(m),
      reply: () => "Pricing depends on what you need — could you tell me a bit more about the project?"
    },
    {
      test: m => /\b(help|support|assist)\b/.test(m),
      reply: () => "I can help with hours, pricing, general questions, or just a chat. What's on your mind?"
    },
    {
      test: m => /\bjoke\b/.test(m),
      reply: () => pick([
        "Why did the developer go broke? Because they used up all their cache.",
        "I'd tell you a UDP joke, but you might not get it.",
        "Why do programmers prefer dark mode? Because light attracts bugs."
      ])
    },
    {
      test: m => /\b(thanks|thank you|thx|cheers)\b/.test(m),
      reply: () => pick(["Anytime.", "You're welcome!", "Glad to help."])
    },
    {
      test: m => /\b(bye|goodbye|see ya|later)\b/.test(m),
      reply: () => "Take care — the line stays open if you need anything else."
    },
    {
      test: m => /\b(name|who are you)\b/.test(m),
      reply: () => "I'm Switchboard, a simple rule-based chat widget. No servers, no API keys — just pattern matching, running entirely in your browser."
    },
    {
      test: m => /\?$/.test(m),
      reply: () => pick([
        "That's a good question — I'm a simple demo bot, so I only know a handful of topics. Try asking about hours, pricing, or help.",
        "I don't have a specific answer for that one, but I'm happy to try a different question."
      ])
    }
  ];

  const fallback = () => pick([
    "I didn't quite catch that — try asking about hours, pricing, or say 'help'.",
    "Not sure how to respond to that yet. I'm a simple rule-based bot.",
    "Hmm, that's outside what I know. Try 'help' to see what I can do."
  ]);

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function respond(message) {
    const m = message.toLowerCase();
    for (const rule of rules) {
      if (rule.test(m)) return rule.reply();
    }
    return fallback();
  }

  // ---- UI wiring --------------------------------------------------------
  function addLine(text, who) {
    const wrap = document.createElement('div');
    wrap.className = 'line line--' + who;

    const tag = document.createElement('div');
    tag.className = 'line__tag';
    tag.textContent = who === 'bot' ? 'Switchboard' : 'You';

    const bubble = document.createElement('div');
    bubble.className = 'line__bubble';
    bubble.textContent = text;

    wrap.appendChild(tag);
    wrap.appendChild(bubble);
    log.appendChild(wrap);
    log.scrollTop = log.scrollHeight;
  }

  function showTyping() {
    const el = document.createElement('div');
    el.className = 'typing';
    el.id = 'typing-indicator';
    el.innerHTML = 'Switchboard is typing<span class="typing__dots"><span>.</span><span>.</span><span>.</span></span>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  function handleSend() {
    const text = input.value.trim();
    if (!text) return;

    addLine(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    showTyping();
    const delay = 450 + Math.random() * 500;
    setTimeout(() => {
      hideTyping();
      addLine(respond(text), 'bot');
      sendBtn.disabled = false;
      input.focus();
    }, delay);
  }

  sendBtn.addEventListener('click', handleSend);

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  input.addEventListener('input', function () {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 90) + 'px';
  });

  // Greeting on load
  addLine("Line's open. Ask about hours, pricing, or just say hi.", 'bot');
  input.focus();
})();
</script>

</body>
</html>
